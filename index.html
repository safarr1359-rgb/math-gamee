<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی الگو چندتاچندتا</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Tahoma,"Vazirmatn",sans-serif;
    background:linear-gradient(135deg,#ffe5f1,#e9e2ff,#dff7ff);
    min-height:100vh;
    color:#573451;
  }
  .screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
  }
  .card{
    width:min(900px,100%);
    background:rgba(255,255,255,.94);
    border-radius:30px;
    padding:30px;
    box-shadow:0 18px 50px rgba(104,65,105,.18);
    text-align:center;
  }
  .start-card{max-width:680px}
  .flower{font-size:54px;margin-bottom:5px}
  h1{margin:5px 0 10px;color:#c34e91;font-size:clamp(28px,5vw,44px)}
  h2{color:#8a5aa8;margin:8px 0 20px}
  .subtitle{font-size:20px;line-height:1.9}
  .info{
    margin:22px auto;
    padding:15px;
    border-radius:18px;
    background:#fff1f8;
    line-height:2;
  }
  button{
    border:0;
    border-radius:18px;
    padding:14px 28px;
    font-size:19px;
    font-family:inherit;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#e65b9c,#9a69d8);
    box-shadow:0 8px 18px rgba(180,77,140,.25);
    transition:.2s;
  }
  button:hover{transform:translateY(-2px)}
  .hidden{display:none!important}
  .top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:15px;
  }
  .badge{
    background:#fff0f7;
    padding:9px 15px;
    border-radius:14px;
    font-weight:bold;
  }
  .progress{
    height:10px;
    background:#eee5f2;
    border-radius:20px;
    overflow:hidden;
    margin:10px 0 24px;
  }
  .bar{
    height:100%;
    width:10%;
    background:linear-gradient(90deg,#f06aa7,#9b70dc);
    transition:.3s;
  }
  .question{
    font-size:22px;
    margin-bottom:18px;
    color:#704064;
  }
  /* مهم: خود الگو کاملاً چپ به راست است */
  .pattern{
    direction:ltr;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:20px auto 25px;
  }
  .num{
    min-width:78px;
    padding:13px 12px;
    border-radius:17px;
    background:#fff4fa;
    border:3px solid #f1afd0;
    font-size:28px;
    font-weight:bold;
    direction:ltr;
    unicode-bidi:plaintext;
  }
  .arrow{
    font-size:30px;
    color:#c55b98;
    font-weight:bold;
    direction:ltr;
  }
  .answer-box{
    width:150px;
    height:64px;
    border:3px dashed #c77eb0;
    border-radius:17px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:bold;
    color:#a44b80;
  }
  .options{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    max-width:650px;
    margin:0 auto;
  }
  .option{
    background:#fff;
    color:#75415f;
    border:2px solid #e6b6d2;
    box-shadow:none;
    padding:14px 8px;
  }
  .option:hover{background:#fff0f7}
  .option.correct{background:#dff7e8;border-color:#62bd83;color:#237143}
  .option.wrong{background:#ffe1e7;border-color:#e07a8c;color:#a3334c}
  .feedback{
    min-height:38px;
    margin:18px 0 5px;
    font-size:19px;
    font-weight:bold;
  }
  .next{margin-top:10px}
  .result h2{font-size:34px}
  .score{
    font-size:46px;
    color:#c34e91;
    font-weight:bold;
    margin:15px;
  }
  .small{font-size:14px;color:#876d80}
  @media(max-width:600px){
    .card{padding:20px}
    .options{grid-template-columns:repeat(2,1fr)}
    .num{min-width:62px;font-size:23px}
    .answer-box{width:100px}
    .arrow{font-size:25px}
  }
</style>
</head>
<body>

<div id="startScreen" class="screen">
  <div class="card start-card">
    <div class="flower">🌸</div>
    <h1>بازی الگو چندتاچندتا</h1>
    <div class="subtitle">با پیدا کردن عدد بعدی، الگو را کامل کن! ✨</div>
    <div class="info">
      👩‍🎓 پایه دوم ابتدایی<br>
      🔢 الگوهای ۲تایی، ۳تایی، ۴تایی، ۵تایی و ۱۰تایی<br>
      🎀 طراح: <b>مریم دولت پور</b><br>
      🏫 دبستان شهید اشرفی<br>
      📅 مهر ۱۴۰۵
    </div>
    <button id="startBtn">شروع بازی 🌷</button>
  </div>
</div>

<div id="gameScreen" class="screen hidden">
  <div class="card">
    <div class="top">
      <div class="badge">🌷 سؤال <span id="qNumber">۱</span> از ۱۰</div>
      <div class="badge">امتیاز: <span id="score">۰</span> ⭐</div>
    </div>

    <div class="progress"><div id="bar" class="bar"></div></div>

    <div id="stageLabel" class="badge" style="display:inline-block;margin-bottom:10px;">الگوی ۲تایی</div>
    <div class="question">عدد بعدی الگو را پیدا کن:</div>

    <div id="pattern" class="pattern"></div>

    <div id="options" class="options"></div>

    <div id="feedback" class="feedback"></div>
    <button id="nextBtn" class="next hidden">سؤال بعدی ➜</button>
  </div>
</div>

<div id="resultScreen" class="screen hidden">
  <div class="card result">
    <div class="flower">🎉🌸🎉</div>
    <h1>آفرین!</h1>
    <h2>بازی را به پایان رساندی</h2>
    <div class="score"><span id="finalScore">۰</span> از ۱۰</div>
    <p id="resultText"></p>
    <button id="againBtn">بازی دوباره 🔄</button>
  </div>
</div>

<script>
const faDigits = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];

function fa(n){
  return String(n).replace(/[0-9]/g, d => faDigits[Number(d)]);
}

const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");
const resultScreen = document.getElementById("resultScreen");
const startBtn = document.getElementById("startBtn");
const againBtn = document.getElementById("againBtn");
const nextBtn = document.getElementById("nextBtn");
const patternEl = document.getElementById("pattern");
const optionsEl = document.getElementById("options");
const feedbackEl = document.getElementById("feedback");
const qNumberEl = document.getElementById("qNumber");
const stageLabelEl = document.getElementById("stageLabel");
const scoreEl = document.getElementById("score");
const finalScoreEl = document.getElementById("finalScore");
const resultTextEl = document.getElementById("resultText");
const barEl = document.getElementById("bar");

let questions = [];
let current = 0;
let score = 0;
let previousRun = new Set();

const types = [
  // شروع هر الگو و تمام عددهای آن، مضرب همان عدد هستند.
  {step:2,  starts:[2,4,6,8,10,12,14], count:2},
  {step:3,  starts:[3,6,9,12], count:2},
  {step:4,  starts:[4,8], count:2},
  {step:5,  starts:[5,10,15,20,25,30,35], count:2},
  {step:10, starts:[10,20,30,40,50,60,70], count:2}
];

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function makeCandidates(type){
  return type.starts.map(start => {
    // دو عدد نشان داده می‌شود و جای خالی همیشه در سمت راست است.
    const answer = start + type.step * 2;

    // محدودیت‌های مسئله:
    // ۲،۳،۴ کمتر از ۲۰
    // ۵تایی کمتر از ۵۰ و همه اعداد مضرب ۵
    // ۱۰تایی کمتر از ۱۰۰
    if(type.step <= 4 && answer >= 20) return null;
    if(type.step === 5 && (answer >= 50 || start % 5 !== 0)) return null;
    if(type.step === 10 && answer >= 100) return null;

    const nums = [start, start+type.step];
    return {
      step:type.step,
      start,
      nums,
      answer,
      key:`${type.step}-${start}`
    };
  }).filter(Boolean);
}

function generateRun(){
  let selected = [];

  for(const type of types){
    let pool = makeCandidates(type).filter(q => !previousRun.has(q.key));

    // اگر بعد از چندین بار بازی بخشی از گزینه‌ها تمام شد،
    // از گزینه‌های معتبر باقی‌مانده استفاده می‌کنیم.
    if(pool.length < type.count) pool = makeCandidates(type);

    shuffle(pool);
    selected.push(...pool.slice(0,type.count));
  }

  shuffle(selected);

  // هر بازی دقیقاً ۱۰ سؤال دارد.
  questions = selected.slice(0, 10);

  previousRun = new Set(questions.map(q => q.key));

  // تضمین قطعی: هر دور بازی دقیقاً ۱۰ سؤال دارد.
  if(questions.length !== 10){
    console.error("خطا: تعداد سؤال‌ها باید دقیقاً ۱۰ باشد.");
  }
}

function startGame(){
  generateRun();
  current = 0;
  score = 0;
  scoreEl.textContent = fa(score);
  startScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");
  showQuestion();
}

function showQuestion(){
  const q = questions[current];

  qNumberEl.textContent = fa(current+1);
  stageLabelEl.textContent = "الگوی " + fa(q.step) + "تایی";
  scoreEl.textContent = fa(score);
  barEl.style.width = ((current+1)/10*100) + "%";
  feedbackEl.textContent = "";
  nextBtn.classList.add("hidden");
  optionsEl.innerHTML = "";

  // direction:ltr باعث می‌شود دقیقاً ۲ → ۴ → ۶ → ؟ دیده شود.
  patternEl.innerHTML = "";

  q.nums.forEach((n, i) => {
    const box = document.createElement("div");
    box.className = "num";
    box.textContent = fa(n);
    patternEl.appendChild(box);

    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "→";
    patternEl.appendChild(arrow);
  });

  const answerBox = document.createElement("div");
  answerBox.className = "answer-box";
  answerBox.textContent = "؟";
  patternEl.appendChild(answerBox);

  // پاسخ صحیح + سه گزینه نزدیک
  let choices = new Set([q.answer]);
  let candidates = [
    q.answer-q.step,
    q.answer+q.step,
    q.answer+1,
    q.answer-1,
    q.answer+2,
    q.answer-2
  ];

  shuffle(candidates);
  for(const c of candidates){
    if(c > 0 && c !== q.answer) choices.add(c);
    if(choices.size === 4) break;
  }

  choices = shuffle([...choices]);

  choices.forEach(value => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = fa(value);
    btn.addEventListener("click", () => checkAnswer(btn, value, q.answer));
    optionsEl.appendChild(btn);
  });
}

function checkAnswer(clicked, value, answer){
  const all = [...optionsEl.querySelectorAll("button")];
  all.forEach(b => b.disabled = true);

  if(value === answer){
    clicked.classList.add("correct");
    score++;
    feedbackEl.textContent = "آفرین! پاسخ درست است 🌟";
    feedbackEl.style.color = "#237143";
  }else{
    clicked.classList.add("wrong");
    feedbackEl.textContent = "اشکالی ندارد؛ پاسخ درست: " + fa(answer) + " 🌷";
    feedbackEl.style.color = "#a3334c";

    all.forEach(b => {
      if(Number(b.textContent.replace(/[۰-۹]/g, d => faDigits.indexOf(d))) === answer){
        b.classList.add("correct");
      }
    });
  }

  scoreEl.textContent = fa(score);
  nextBtn.classList.remove("hidden");
}

nextBtn.addEventListener("click", () => {
  // ابتدا سؤال بعدی را مشخص می‌کنیم.
  current++;

  // تا وقتی ۱۰ سؤال تمام نشده، حتماً سؤال بعدی نمایش داده می‌شود.
  if(current < questions.length){
    showQuestion();
  }else{
    showResult();
  }
});

function showResult(){
  gameScreen.classList.add("hidden");
  resultScreen.classList.remove("hidden");
  finalScoreEl.textContent = fa(score);

  if(score === 10){
    resultTextEl.textContent = "فوق‌العاده بود! همه‌ی الگوها را درست پیدا کردی 🌈✨";
  }else if(score >= 7){
    resultTextEl.textContent = "خیلی خوب بود! با کمی تمرین قهرمان الگوها می‌شوی 🌸";
  }else{
    resultTextEl.textContent = "آفرین که تلاش کردی! یک بار دیگر بازی کن و بهتر شو 💕";
  }
}

startBtn.addEventListener("click", startGame);
againBtn.addEventListener("click", startGame);
</script>
</body>
</html>
